name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.19'
          cache: npm

      - name: Pin npm with lifecycle-script policy support
        run: npm install --global npm@11.18.0 --ignore-scripts --no-audit --engine-strict=false

      - name: Install dependencies
        run: npm ci --strict-allow-scripts --no-audit

      - name: Report unreviewed lifecycle scripts
        run: npm install-scripts ls --json

      - name: Scan for committed secrets
        run: npm run check:secrets

      - name: Scan all reachable Git history for secrets
        run: npm run check:history-secrets

      - name: Check color-contrast tokens
        run: npm run check:contrast

      - name: Check for placeholder repo slugs
        run: npm run check:placeholders

      - name: Check CTI product scope
        run: npm run check:cti-scope

      - name: Check referenced assets exist
        run: npm run check:assets

      - name: Validate landing HTML, links, semantics, and metadata
        run: npm run check:landing

      - name: Smoke-test landing page at desktop and phone widths
        run: npm run check:landing:render

      - name: Verify production evidence and Settings fixtures in Chromium
        run: npm run check:evidence:render

      - name: Verify reader, Wall, and theme layouts
        run: |
          npm run check:design:render
          npm run check:theme:render
        env:
          DESIGN_SCREENSHOT_DIR: ${{ runner.temp }}/design-acceptance
          THEME_SCREENSHOT_DIR: ${{ runner.temp }}/theme-acceptance

      - name: Retain design and theme evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          retention-days: 14
          name: design-acceptance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/design-acceptance
            ${{ runner.temp }}/theme-acceptance

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Verify production downloads and Chromium Print Edition PDF
        run: npm run check:handoff:render
        env:
          HANDOFF_ARTIFACT_DIR: ${{ runner.temp }}/handoff-acceptance

      - name: Retain synthetic handoff files and every rendered PDF page
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: handoff-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/handoff-acceptance
          if-no-files-found: warn
          retention-days: 14

      - name: Check score-model gold bands
        run: npm run check:scoring

      - name: Check release metadata
        run: npm run check:release

      - name: Audit full dependency graph
        run: npm audit --audit-level=high

      - name: Audit production dependency graph
        if: ${{ always() }}
        run: npm audit --omit=dev --audit-level=low

  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['22.19', '24', '26']
        include:
          - os: windows-latest
            node-version: '22.19'
          - os: windows-latest
            node-version: '26'
          - os: macos-26
            node-version: '26'
          - os: macos-26-intel
            node-version: '26'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies through the documented source workflow
        run: npm install --no-audit

      - name: Verify the source install preserves the lockfile
        run: git diff --exit-code -- package-lock.json

      - name: Smoke-test the documented startup command
        run: npm start
        env:
          BLUETEAM_STARTUP_SMOKE: '1'
          HOST: '127.0.0.1'
          PORT: '3000'
          NODE_ENV: test

      - name: Run tests
        run: npm test

  safari:
    name: Safari / macOS 15 Intel
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Enable Apple's installed SafariDriver on the temporary runner
        run: sudo /usr/bin/safaridriver --enable

      - name: Verify production fixtures in actual Safari
        run: npm run check:safari:render
        env:
          SAFARI_ARTIFACT_DIR: ${{ runner.temp }}/safari-acceptance

      - name: Retain Safari screenshots, capabilities, and driver log
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safari-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/safari-acceptance
          if-no-files-found: warn
          retention-days: 14

  release-ready:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [policy, test, safari]
    if: ${{ always() }}
    steps:
      - name: Require repository policy and every runtime job to pass
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SAFARI_RESULT: ${{ needs.safari.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$SAFARI_RESULT" = success
